version: '3.8'

services:
  backend:
    image: tochihuy/mern-backend:1.0
    container_name: mern-backend-hub
    ports:
      - "5000:5000"
    environment:
      
      - MONGODB_URI=mongodb+srv://adminchihuyto:Huy220805@cluster0.jlofz1s.mongodb.net/cloud_lab?appName=Cluster0
    networks:
      - mern-net

  frontend:
    image: tochihuy/mern-frontend:1.0
    container_name: mern-frontend-hub
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - mern-net

networks:
  mern-net:
    driver: bridge